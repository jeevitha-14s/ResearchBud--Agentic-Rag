[project]
name = "arxiv-rag"
version = "0.1.0"
description = "arXiv Paper Curator — agentic RAG portfolio project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "openai>=1.55",
    "langfuse>=2.53",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
exclude = ["streamlit_app"]

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.agents.graph"
disable_error_code = ["call-overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
